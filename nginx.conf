server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Client-side routes fall back to the SPA entry point.
    location / {
        try_files $uri $uri/ /index.html;
        # index.html must be re-checked on every load, otherwise browsers keep running the
        # previous build's JavaScript after a redeploy. (Hashed /assets/ files stay cached.)
        add_header Cache-Control "no-cache";
    }

    # Hashed build assets can be cached for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
