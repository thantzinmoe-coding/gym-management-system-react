# React web app served by nginx (local development).
#
#   docker network create gym-net        # once
#   docker compose up -d --build         # from this folder
#
# Open http://localhost:3001. The browser calls the API directly at localhost:8080, so the
# backend stack must be running. Port 3001 is required: the backend's CORS and WebSocket
# settings allow http://localhost:3001.

name: gym-frontend

services:
  frontend:
    build:
      context: .
      args:
        VITE_API_BASE_URL: http://localhost:8080
        VITE_WS_BASE_URL: http://localhost:8080/ws
    ports:
      - "127.0.0.1:3001:80"
    restart: unless-stopped

networks:
  default:
    name: gym-net
    external: true
