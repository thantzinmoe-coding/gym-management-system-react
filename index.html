    <style>
      body { margin: 0; background: #fafbfc; }
      .boot-bar { height: 64px; border-bottom: 1px solid #e5e7eb; background: #fff; }
      .boot-body { max-width: 1100px; margin: 0 auto; padding: 32px 24px; display: grid; gap: 20px; }
      .boot-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
      .boot-block { background: #f1f3f5; border-radius: 10px; animation: boot-pulse 1.6s ease-in-out infinite; }
      @keyframes boot-pulse { 50% { opacity: .55; } }
      @media (max-width: 640px) { .boot-row { grid-template-columns: 1fr; } }
      @media (prefers-color-scheme: dark) { body { background: #0b0f14; } .boot-bar { background: #0f141a; border-color: #1f2933; } .boot-block { background: #18202a; } }
    </style>
  </head>

  <body>
    <div id="root">
      <!-- Shown until the app's JavaScript has loaded; React replaces it on start. -->
      <div class="boot" role="status" aria-label="Loading">
        <div class="boot-bar"></div>
        <div class="boot-body">
          <div class="boot-block" style="height:36px;width:260px"></div>
          <div class="boot-block" style="height:16px;width:380px;max-width:100%"></div>
          <div class="boot-row">
            <div class="boot-block" style="height:112px"></div>
            <div class="boot-block" style="height:112px"></div>
            <div class="boot-block" style="height:112px"></div>
          </div>
          <div class="boot-block" style="height:260px"></div>
        </div>

    </div>
